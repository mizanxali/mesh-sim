[package]
name = "mesh-sim"
version = "0.1.0"
edition = "2021"
description = "A browser playground for the Offline Protocol mesh, over the real engine"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Without default features: the telemetry thread and the POSIX file store do
# not exist in a browser.
offline-protocol = { version = "=0.31.0", default-features = false }
offline-protocol-core = "=0.31.0"
# `test-utils` is the mock radio every simulated device owns.
offline-protocol-transport = { version = "=0.31.0", features = ["test-utils"] }
serde_json = "1"
# Must equal the wasm-bindgen CLI that build.sh runs.
wasm-bindgen = "=0.2.105"

# The browser's entropy backends, as the SDK's own web crate names them.
# Each library compiles for wasm32-unknown-unknown and fails unless its
# JavaScript backend is named.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
uuid = { version = "1.6", features = ["js"] }
openmls = { version = "0.7", features = ["js"] }

[profile.release]
opt-level = "s"
lto = true
